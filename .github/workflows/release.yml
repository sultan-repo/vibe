name: Publish Vibe release

# Publishes the version written in plugin/.claude-plugin/plugin.json: the tag
# v<version> and a GitHub release whose notes are that version's section of
# CHANGES.md. To release, raise the version, add its "## <version>" section to
# CHANGES.md and merge to main.
#
# It starts only after "Vibe checks" has passed on a push to main in this repository,
# so the write permission below never reaches pull-request code. Every later push to
# main with the same version finds the release already there and changes nothing.
on:
  workflow_run:
    workflows: ["Vibe checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-vibe-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Read the version and its release notes
        id: source
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "::error::The checked-out commit is not the commit that was tested."; exit 1; }
          version="$(python3 -c 'import json; print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version in plugin/.claude-plugin/plugin.json ('$version') is not three numbers separated by dots."
            exit 1
          fi
          # The notes are the lines under the heading "## <version>" (a date may follow it), up to the next "## " heading.
          awk -v v="$version" '/^## / { on = ($0 == "## " v || index($0, "## " v " ") == 1); next } on' CHANGES.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGES.md has no release notes under a heading that starts with '## $version'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the tag and the GitHub release (does nothing if already published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # Where the release and the tag point today, if they exist. An annotated tag is followed to its commit.
          released_sha="$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$tag\") | .target_commitish")"
          tag_object="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"refs/tags/$tag\") | [.object.type, .object.sha] | @tsv")"
          read -r tag_type tag_sha <<< "$tag_object"
          while [ "$tag_type" = "tag" ]; do
            tag_object="$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object | [.type, .sha] | @tsv')"
            read -r tag_type tag_sha <<< "$tag_object"
          done
          if [ -n "$tag_sha" ] && [ "$tag_type" != "commit" ]; then
            echo "::error::The tag $tag does not resolve to a commit."
            exit 1
          fi
          # Already released: nothing to do, whichever commit of main was just tested.
          if [ -n "$released_sha" ]; then
            if [[ ! "$released_sha" =~ ^[0-9a-f]{40}$ ]] || [ "$tag_sha" != "$released_sha" ]; then
              echo "::error::The published release $tag and its tag do not point at the same full commit SHA."
              exit 1
            fi
            echo "Vibe $tag was already published at $released_sha. No changes made."
            if [ "$released_sha" != "$TESTED_SHA" ]; then
              # Claude Code offers an update only when the version changes. A changed plugin under an
              # unchanged version would reach nobody who has it installed, so that is an error.
              changed="$(gh api "repos/$GH_REPO/compare/$released_sha...$TESTED_SHA" \
                --jq 'if .status == "ahead" then [.files[].filename | select(startswith("plugin/"))] | length else 0 end')"
              if [ "$changed" != "0" ]; then
                echo "::error::plugin/ changed after $tag was published but the version did not. Raise the version in plugin/.claude-plugin/plugin.json."
                exit 1
              fi
              echo "Commit $TESTED_SHA is not released. A new release needs a new version in plugin/.claude-plugin/plugin.json."
            fi
            exit 0
          fi
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$TESTED_SHA" ]; then
            echo "Skipping stale CI commit $TESTED_SHA; main is $main_sha."
            exit 0
          fi
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$TESTED_SHA" ]; then
            echo "::error::The existing tag $tag does not match the tested commit $TESTED_SHA."
            exit 1
          fi
          if [ -z "$tag_sha" ]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$TESTED_SHA" >/dev/null
          fi
          printf '\n\n## Release provenance\n\n- Successful CI run: %s\n- Tested commit: `%s`\n' "$CI_RUN_URL" "$TESTED_SHA" >> "$RUNNER_TEMP/notes.md"
          gh release create "$tag" \
            --verify-tag \
            --target "$TESTED_SHA" \
            --title "Vibe $tag" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
