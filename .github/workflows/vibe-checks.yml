name: Vibe checks

# Runs on every pull request and on every push to main. Read-only: no secrets, no
# publishing. The release workflow (release.yml) starts only after this one passes
# on main, and finds it by the name above.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Branch protection on main requires two checks called "validate" and
# "native-mod-render". GitHub reports a check under the job's "name:", or under its
# ID when it has none, and adds a suffix for a matrix. So these two jobs keep their
# IDs and have neither a "name:" nor a matrix.
jobs:
  # Tests and file checks. No model calls, standard library only.
  validate:
    # ubuntu-24.04 rather than ubuntu-latest: it is the newest runner image that
    # still offers Python 3.9, the python3 that comes with macOS developer tools.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Shell syntax and JSON validity
        run: |
          sh -n plugin/hooks/run.sh
          for file in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/hooks/hooks.json; do
            python3 -m json.tool "$file" >/dev/null
          done
      - name: Tests on Python 3.11
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'
          python3 -B -m unittest discover -s tests -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Tests on Python 3.9 (the oldest supported)
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          python3 -B -m unittest discover -s tests -v

  # Claude Code's own validator accepts the marketplace file and the plugin.
  # The ID "native-mod-render" is kept only because the required-check setting names
  # it; rename it once the owner has updated branch protection.
  native-mod-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Claude Code version Vibe was measured on
        run: npm install --global @anthropic-ai/claude-code@2.1.331
      - name: Validate the marketplace file
        run: claude plugin validate --strict .
      - name: Validate the plugin
        run: claude plugin validate --strict plugin
