name: Vibe checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static file validation
        run: |
          for script in install.sh uninstall.sh hooks/*.sh hooks/pre-push.template; do
            bash -n "$script"
          done
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -c 'import json; assert json.load(open(".claude-plugin/plugin.json"))["version"] == "4.12.1"'
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool hooks/hooks.json >/dev/null
      - name: Benchmark harness self-test (no model calls)
        run: node --test tests/benchmark-runner.test.mjs
      - name: Force-push protection
        run: python3 hooks/test-force-push-hook.py
      - name: Review workflow and YAML skill metadata
        run: |
          python3 -m pip install "PyYAML>=6.0,<7"
          python3 -m unittest discover -s tests -v
      - name: Install and uninstall smoke test
        run: |
          VIBE_SMOKE_ROOT="$(mktemp -d)"
          export VIBE_CLAUDE_HOME="$VIBE_SMOKE_ROOT/.claude"
          trap 'rm -rf "$VIBE_SMOKE_ROOT"' EXIT
          bash ./install.sh
          test -f "$VIBE_CLAUDE_HOME/agents/reviewer.md"
          test -f "$VIBE_CLAUDE_HOME/agents/worker.md"
          for level in low medium high; do
            test -f "$VIBE_CLAUDE_HOME/skills/effort-$level/SKILL.md"
          done
          test -f "$VIBE_CLAUDE_HOME/hooks/check-force-push.py"
          test -f "$VIBE_CLAUDE_HOME/vibe-tools/session-start.sh"
          test -f "$VIBE_CLAUDE_HOME/vibe-tools/session-start.py"
          test -f "$VIBE_CLAUDE_HOME/vibe-tools/project_setup.py"
          test -f "$VIBE_CLAUDE_HOME/vibe-tools/project-adoption.md"
          test -f "$VIBE_CLAUDE_HOME/vibe-tools/verification-cache.py"
          test -f "$VIBE_CLAUDE_HOME/vibe-tools/pre-push.template"
          test ! -f "$VIBE_CLAUDE_HOME/vibe-tools/review-result.schema.json"
          bash ./uninstall.sh
          test ! -f "$VIBE_CLAUDE_HOME/agents/reviewer.md"
          test ! -f "$VIBE_CLAUDE_HOME/agents/worker.md"
          for level in low medium high; do
            test ! -d "$VIBE_CLAUDE_HOME/skills/effort-$level"
          done
          test ! -f "$VIBE_CLAUDE_HOME/hooks/check-force-push.py"
          test ! -f "$VIBE_CLAUDE_HOME/vibe-tools/session-start.sh"
          test ! -f "$VIBE_CLAUDE_HOME/vibe-tools/session-start.py"
          test ! -f "$VIBE_CLAUDE_HOME/vibe-tools/project_setup.py"
          test ! -f "$VIBE_CLAUDE_HOME/vibe-tools/project-adoption.md"
          test ! -f "$VIBE_CLAUDE_HOME/vibe-tools/verification-cache.py"

  native-mod-render:
    # Legacy job ID retained for required-check compatibility; the removed Mod has no render test.
    # Every PR can deliver through main: validate before merge, regardless of branch name.
    # Keep native checks read-only here; publication remains limited to trusted main pushes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.314
      - name: Validate plugin package
        run: claude plugin validate --strict .
      - name: Verify a fresh Codex installation and first prompt
        run: |
          npm install --global @openai/codex@0.162.1
          python3 -m unittest discover -s tests -p test_codex_installation.py -v
